<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IACAS — Connexion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }

    .login-card {
      background: #fff;
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo .app-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: #2563eb;
      border-radius: 1rem;
      margin-bottom: 0.75rem;
    }

    .login-logo .app-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .login-logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .login-logo p {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: #374151;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 1rem;
      color: #0f172a;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .btn-login {
      width: 100%;
      padding: 0.7rem 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.25rem;
    }

    .btn-login:hover { background: #1d4ed8; }
    .btn-login:active { background: #1e40af; }

    .btn-login:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 0.5rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }

    .error-msg.visible { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <div class="app-icon">
          <!-- Icône dossier / briefcase -->
          <svg viewBox="0 0 24 24">
            <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          </svg>
        </div>
        <h1>IACAS OTA</h1>
        <p>Gestionnaire de candidatures</p>
      </div>

      <div id="error-msg" class="error-msg" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Identifiant</label>
          <input
            id="username"
            type="text"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            placeholder="Votre identifiant"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>

        <button id="submit-btn" type="submit" class="btn-login">
          Se connecter
        </button>
      </form>

    </div>

    <div class="login-footer">IACAS OTA v1.0</div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function clearError() {
      errorMsg.textContent = '';
      errorMsg.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Veuillez remplir tous les champs.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion…';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin',
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Stocker le TOKEN agent dans sessionStorage
          if (data.token) {
            sessionStorage.setItem('agent_token', data.token);
          }
          // Stocker les infos utilisateur
          if (data.user) {
            sessionStorage.setItem('current_user', JSON.stringify(data.user));
          }
          window.location.href = data.redirect || '/';
        } else {
          showError(data.error || 'Erreur de connexion. Veuillez réessayer.');
        }
      } catch {
        showError('Impossible de contacter le serveur. Vérifiez votre connexion.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
      }
    });

    // Soumettre avec Entrée
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
    });
  </script>
</body>
</html>
